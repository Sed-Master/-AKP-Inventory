<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet Table</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 960px; margin: 2rem auto; padding: 0 1rem;
      background: #f9fafb; color: #111;
    }
    h1 { font-size: 1.4rem; }
    .meta { font-size: .8rem; color: #666; margin-bottom: 1rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #1f2937; color: #fff; font-size: .85rem; text-transform: uppercase; }
    tr:hover td { background: #f3f4f6; }
  </style>
</head>
<body>
  <h1>📊 Live Sheet Data</h1>
  <p class="meta" id="meta">Loading…</p>
  <div class="table-wrap" id="data"><p>Loading…</p></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR1ATW8BgNvotDExNUOBCNz2GMERN7JmIgVWBvzJvri5ZeIZPC21tJhLQsI_CYFclxrVQCkJ7cLIxlx/pub?gid=0&single=true&output=csv';
    const REFRESH_MS = 60_000;

    async function load() {
      try {
        const res = await fetch(CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        Papa.parse(text, {
          header: true, skipEmptyLines: true,
          complete: (results) => {
            const { data, fields } = results;
            if (!data.length) {
              document.getElementById('data').innerHTML = '<p>Sheet is empty.</p>';
              return;
            }
            let html = '<table><thead><tr>';
            fields.forEach(f => html += `<th>${f}</th>`);
            html += '</tr></thead><tbody>';
            data.forEach(row => {
              html += '<tr>';
              fields.forEach(f => html += `<td>${row[f] ?? ''}</td>`);
              html += '</tr>';
            });
            html += '</tbody></table>';
            document.getElementById('data').innerHTML = html;
            document.getElementById('meta').textContent =
              `${data.length} rows · updated ${new Date().toLocaleTimeString()}`;
          }
        });
      } catch (e) {
        document.getElementById('data').innerHTML = `<p style="color:red">${e.message}</p>`;
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
